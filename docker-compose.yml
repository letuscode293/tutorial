services:
  api:
    build: ./ml_pipeline
    ports:
      - "8000:8000"
    volumes:
      - ./ml_pipeline/models:/app/models
      - ./ml_pipeline/datasets:/app/datasets:ro

  data_entry:
    image: python:3.11-slim
    working_dir: /app/data_entry
    ports:
      - "8001:8001"
    environment:
      GITHUB_RETRAIN: "false"
      AUTO_PIPELINE: "false"
      ML_PIPELINE_ROOT: /app/ml_pipeline
      API_RELOAD_URL: http://api:8000/reload-models
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - ./data_entry:/app/data_entry
      - ./ml_pipeline:/app/ml_pipeline
    command: >
      bash -c "pip install -q -r requirements.txt &&
               python manage.py migrate --noinput &&
               python manage.py load_datasets &&
               python manage.py runserver 0.0.0.0:8001"
    depends_on:
      - api

  dashboard:
    image: python:3.10-slim
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      GDSS2026_API_URL: http://api:8000
    volumes:
      - ./ml_pipeline:/app
    command: >
      bash -c "pip install -q streamlit requests &&
               streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api
