services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: python:3.10-slim
    working_dir: /app/gdss2026_web
    ports:
      - "8001:8001"
    environment:
      AUTO_PIPELINE: "true"
      API_RELOAD_URL: http://api:8000/reload-models
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
    command: >
      bash -c "pip install -q -r /app/gdss2026_web/requirements.txt -r /app/requirements.txt &&
               python manage.py migrate &&
               python manage.py load_datasets &&
               python manage.py runserver 0.0.0.0:8001"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    image: python:3.10-slim
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      GDSS2026_API_URL: http://api:8000
    volumes:
      - .:/app
    command: >
      bash -c "pip install -q streamlit requests &&
               streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
