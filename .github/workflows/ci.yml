name: GDSS2026 Pipeline CI

on:
  push:
    branches: [main, master, richard]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r gdss2026_web/requirements.txt

      - name: Train tabular models (automated build step)
        run: python scripts/train_tabular.py

      - name: Run API tests
        run: pytest tests/ -v

      - name: Verify Django data manager
        run: |
          cd gdss2026_web
          python manage.py migrate
          python manage.py load_datasets
          python manage.py export_datasets

      - name: Run full automation script
        run: python scripts/automate_pipeline.py
