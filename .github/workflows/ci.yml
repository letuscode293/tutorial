name: GDSS2026 Pipeline CI

on:
  push:
    branches: [main, master, richard]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train tabular models
        run: python scripts/train_tabular.py

      - name: Run API tests
        run: pytest tests/ -v
