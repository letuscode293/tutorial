name: CropAI Pipeline CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install fastapi uvicorn python-multipart pydantic scikit-learn joblib numpy pandas httpx pytest

      - name: Train tabular models (automated build step)
        run: python scripts/train_tabular.py

      - name: Run API tests
        run: pytest tests/ -v
